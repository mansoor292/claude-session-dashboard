# Never let needrestart auto-restart the session units.
#
# relaunch.sh starts the tmux server, so the server and every Claude session it holds sit
# in claude-restore.service's cgroup. On 2026-09-02 an unattended-upgrades run of libssh,
# zlib and util-linux had needrestart restart that unit twice; each stop reaped the whole
# cgroup and killed all 22 sessions. claude-restore.service now carries KillMode=process
# so a stop no longer reaps them — this file is the second layer: a long-lived agent
# session is not a daemon, and nothing about a library upgrade should be cycling it.
# 2026-09-03: claude-dashboard-ctl.service was the one session unit missing from this list.
# needrestart restarted it three times in 22 seconds during an ncurses/libgcrypt/libevent
# upgrade, and each stop reaped the _dashboard session in its cgroup — killing a two-day
# conversation and two 10-second replacements. Same class of failure as claude-restore on
# 2026-09-02; it was simply not covered here.
$nrconf{override_rc}->{qr(^claude-dashboard-ctl\.service$)} = 0;
$nrconf{override_rc}->{qr(^claude-restore\.service$)} = 0;
$nrconf{override_rc}->{qr(^session-dashboard\.service$)} = 0;
$nrconf{override_rc}->{qr(^ttyd\.service$)} = 0;
